name: Release

# Push a tag like v0.2.0 after `pnpm version:set 0.2.0` and merging it (see CONTRIBUTING.md).
# Builds the Windows installer and a universal macOS app, signs the updates with
# TAURI_SIGNING_PRIVATE_KEY and publishes latest.json, which the in-app "Check for updates" button reads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Release notes list the pull requests since the previous release.
  pull-requests: read

jobs:
  build:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every job merges its platform into the release's latest.json; run in parallel, one job
      # could overwrite the other's entry.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust-targets: ""
          # One app for Intel and Apple Silicon. Ad-hoc signed (tauri.conf.json), not notarized:
          # Gatekeeper asks for confirmation on first launch.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release notes need the tags to find the previous release.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/desktop

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the files would publish an installer labelled with the wrong version.
      - run: node scripts/version.mjs check ${{ github.ref_name }}

      # The release body is this tag's CHANGELOG.md section plus the pull requests and contributors
      # since the previous release; a stable tag without a Highlights section fails here.
      - name: Release notes
        id: notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "$GITHUB_REF_NAME"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: EmberTerm ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # A pre-release is never GitHub's "latest", so the updater endpoint (releases/latest) ignores it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          # Point the Windows updater at the NSIS installer instead of the MSI.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # The landing page reads the latest release at build time, so rebuild it once every platform
  # has uploaded its assets (it fails the build on a missing installer). Needs the repo secret
  # SITE_DEPLOY_HOOK_URL, a Vercel deploy hook; without it the step only warns.
  site:
    name: Rebuild site
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger deploy hook
        env:
          HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::SITE_DEPLOY_HOOK_URL is not set; the site was not rebuilt."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK_URL" > /dev/null
