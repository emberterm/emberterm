[package]
name = "emberterm"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
base64 = "0.22"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
notify = "6"
fontdb = "0.23"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
# default features off: its "zip" feature pulls in zip 4, which crates.io has yanked, so Linux
# archive updates are unavailable; Windows installers (.exe) and macOS .app.tar.gz do not need it.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
